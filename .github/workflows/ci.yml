        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Versione Go in uso
        id: go_v
        continue-on-error: true
        if: steps.rilevamento.outputs.api == 'presente'
        run: go version

      - name: api/ — build
        id: api_build
        continue-on-error: true
        if: steps.rilevamento.outputs.api == 'presente'
        working-directory: api
        run: go build ./...

      - name: api/ — lint (golangci-lint)
        id: api_lint
        continue-on-error: true
        if: steps.rilevamento.outputs.api == 'presente'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: api
          version-file: .golangci-lint-version
          skip-cache: true

      - name: api/ — test (-race -count=1 -v, niente cache)
        id: api_test
        continue-on-error: true
        if: steps.rilevamento.outputs.api == 'presente'
        working-directory: api
        run: go test -race -count=1 -v ./...

      - name: Prova — riassunto degli esiti
        if: always()
        run: |
          fallito=0
          while IFS='|' read -r esito nome; do
            if [ -z "$nome" ]; then continue; fi
            echo "ESITO $esito | $nome"
            if [ "$esito" = "failure" ]; then fallito=1; fi
          done <<'ESITI'
          ${{ steps.checkout.outcome }}|Checkout
          ${{ steps.node.outcome }}|Node.js (da .nvmrc)
          ${{ steps.node_v.outcome }}|Versione Node in uso
          ${{ steps.sha.outcome }}|SHA verificato
          ${{ steps.rilevamento.outcome }}|Rilevamento aree
          ${{ steps.tests_ci.outcome }}|Collaudo del workflow (tests/ci)
          ${{ steps.site_pnpm.outcome }}|site/ — pnpm (corepack) e versione in uso
          ${{ steps.site_install.outcome }}|site/ — installazione dipendenze
          ${{ steps.site_build.outcome }}|site/ — build
          ${{ steps.site_lint.outcome }}|site/ — lint
          ${{ steps.site_check.outcome }}|site/ — astro check
          ${{ steps.radice_install.outcome }}|Progetto di collaudo (radice) — installazione dipendenze
          ${{ steps.playwright.outcome }}|Playwright — Chromium
          ${{ steps.e2e.outcome }}|Test di accettazione (e2e)
          ${{ steps.perf.outcome }}|Misura di laboratorio (AC39)
          ${{ steps.go.outcome }}|api/ — Go (da api/go.mod)
          ${{ steps.go_v.outcome }}|Versione Go in uso
          ${{ steps.api_build.outcome }}|api/ — build
          ${{ steps.api_lint.outcome }}|api/ — lint (golangci-lint)
          ${{ steps.api_test.outcome }}|api/ — test (-race -count=1 -v, niente cache)
          ESITI
          exit "$fallito"

  # PROVA ESPLORATIVA, da non mergiare: copia del job `ci` su ubuntu-24.04, ogni
