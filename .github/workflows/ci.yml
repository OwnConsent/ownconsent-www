# Stadio 03 — contesto ci: build, lint, typecheck e test di ogni PR verso main.
# Interfaccia fissata da docs/adr/0003-contesto-ci.md. Il nome del job (`ci`) e'
# quello che una persona lega, con un gate umano separato, ai required status
# checks di main (AC21, non_goal di questo lotto). Non rinominare il job senza
# passare dal percorso di deprecazione dell'ADR, sezione D1.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: ci
    # Immagine fissata: dal 19/10 al 19/11/2026 ubuntu-latest passa a
    # Ubuntu 26.04 (actions/runner-images#14748). Il passaggio a 26.04 si
    # prova in una PR sua, non arriva da solo.
    runs-on: ubuntu-24.04
    env:
      # ADR-0002, D9: nessuna telemetria di terzi da un repository pubblico.
      # Vale anche quando site/ e' assente (ADR-0003, D4).
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Node.js (da .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Versione Node in uso
        run: node -v

      - name: SHA verificato
        run: git rev-parse HEAD

      # Interfaccia di .github/ci/area.sh: ADR-0003, D6.
      - name: Rilevamento aree
        id: rilevamento
        run: |
          set +e
          bash .github/ci/area.sh site
          site_status=$?
          bash .github/ci/area.sh api
          api_status=$?
          set -e
          if [ "$site_status" -ne 0 ] || [ "$api_status" -ne 0 ]; then
            exit 1
          fi

      # ADR-0003, sezione datata 21/09/2026, D7: verifica la forma statica del
      # workflow (tests/ci/**). Non e' un'area (non dipende da site/ ne' da api/):
      # nessun if, cosi' protegge anche i commit in cui site/ e' assente.
      - name: Collaudo del workflow (tests/ci)
        working-directory: tests/ci
        run: |
          python3 --version
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"
          python3 -m unittest discover -s . -p 'test_*.py'

      # --- site/ (solo se l'area e' presente) ---

      - name: site/ — pnpm (corepack) e versione in uso
        if: steps.rilevamento.outputs.site == 'presente'
        working-directory: site
        run: |
          corepack enable
          pnpm -v

      - name: site/ — installazione dipendenze
        if: steps.rilevamento.outputs.site == 'presente'
        working-directory: site
        run: pnpm install --frozen-lockfile

      - name: site/ — build
        if: steps.rilevamento.outputs.site == 'presente'
        working-directory: site
        run: pnpm build

      - name: site/ — lint
        if: steps.rilevamento.outputs.site == 'presente'
        working-directory: site
        run: pnpm lint

      - name: site/ — astro check
        if: steps.rilevamento.outputs.site == 'presente'
        working-directory: site
        run: pnpm astro check

      # --- collaudo alla radice (ADR-0002 D8): solo se site/ e' presente, non
      # e' un'area propria e non c'e' niente da collaudare senza una build di
      # site/ (ADR-0003, sezione datata 21/09/2026, D3 punto 3). Forma piena
      # `pnpm install --frozen-lockfile`, mai l'alias `pnpm i`: il selettore di
      # tests/ci/test_ac06_ac07_site_steps.py (D9) distingue i due `pnpm
      # install` per working-directory, non per verbo, e questo passo non porta
      # working-directory: site.

      - name: Progetto di collaudo (radice) — installazione dipendenze
        if: steps.rilevamento.outputs.site == 'presente'
        run: pnpm install --frozen-lockfile

      - name: Playwright — Chromium
        if: steps.rilevamento.outputs.site == 'presente'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test di accettazione (e2e)
        if: steps.rilevamento.outputs.site == 'presente'
        run: pnpm test:e2e

      - name: Misura di laboratorio (AC39)
        if: steps.rilevamento.outputs.site == 'presente'
        run: pnpm test:perf

      # --- api/ (solo se l'area e' presente) ---

      - name: api/ — Go (da api/go.mod)
        if: steps.rilevamento.outputs.api == 'presente'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Versione Go in uso
        if: steps.rilevamento.outputs.api == 'presente'
        run: go version

      - name: api/ — build
        if: steps.rilevamento.outputs.api == 'presente'
        working-directory: api
        run: go build ./...

      - name: api/ — lint (golangci-lint)
        if: steps.rilevamento.outputs.api == 'presente'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: api
          version-file: .golangci-lint-version
          skip-cache: true

      - name: api/ — test (-race -count=1 -v, niente cache)
        if: steps.rilevamento.outputs.api == 'presente'
        working-directory: api
        run: go test -race -count=1 -v ./...

  # PROVA ESPLORATIVA, da non mergiare: copia del job `ci` su ubuntu-26.04, ogni
  # passo con continue-on-error, per leggere tutti gli esiti in una run sola.
  # Non e' un contesto richiesto.
  prova-2604:
    name: prova-2604
    runs-on: ubuntu-26.04
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Prova — immagine e strumenti
        run: |
          set +e
          echo "Image: ${ImageOS:-non definita}"
          echo "Version: ${ImageVersion:-non definita}"
          python3 --version
          echo "uscita di python3 --version: $?"
          python3 -c 'import yaml; print(yaml.__version__)'
          echo "uscita di import yaml: $?"
          for cmd in stat date od tr head wc mktemp; do
            echo "--- $cmd"
            "$cmd" --version | head -1
