# Manutenzione notturna — PR piccole e separate, una ragione per PR.
name: Manutenzione agentica

on:
  # Attenzione: su un repository pubblico GitHub disattiva le schedule dopo
  # 60 giorni senza attivita' sul repo. Se il progetto si ferma, questa
  # smette di partire in silenzio: riattivala da Actions.
  schedule:
    - cron: '0 2 * * 2'   # martedì 04:00 Europe/Rome
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  manutenzione:
    # Immagine fissata a ubuntu-26.04: migrazione fatta con una prova
    # (PR #84, journal/2026-10-04/163102), non per il calendario di
    # ubuntu-latest (actions/runner-images#14748).
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Senza questo input l'azione si autentica come app GitHub di Claude, che
          # su questo repo non e' installata: 401 il 29/09 (run 36537879381). Col
          # token del workflow i permessi sono quelli dichiarati sopra, e l'OIDC
          # non viene chiesto (token.ts).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Fai la manutenzione ricorrente di questo repository.

            1. Aggiornamenti patch e minor delle dipendenze, raggruppati per ecosistema.
            2. Test flaky: identifica, riproduci ripetendo, correggi la causa.
            3. Audit di sicurezza delle dipendenze: se emerge una CVE alta o critica,
               apri una issue con label `security` invece di una PR.

            UNA PR PER COSA. Mai mescolare. Non toccare file coinvolti in PR aperte.
            Ogni PR deve avere test verdi prima di essere aperta; se non passano, non
            aprirla e apri invece una issue con l'errore.

            Se in totale non c'è nulla da fare, non aprire nulla e termina.
          # --max-turns 100 e' una stima: circa il doppio dell'unico dato misurato,
          # 51 (run 37618168526, fallito col tetto a 30). L'action confronta il
          # tetto con num_turns, che conta le chiamate di tool; il CLI lo applica
          # alle risposte API (journal/2026-10-07/205331). Il tetto reale e'
          # timeout-minutes del job. Il commento sta qui e non accanto al valore
          # perche' dentro lo scalare a blocco sarebbe un argomento.
          claude_args: |
            --max-turns 100
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash,Task"
            --model claude-haiku-4-5-20251001
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
