# Manutenzione notturna — PR piccole e separate, una ragione per PR.
name: Manutenzione agentica

on:
  # Attenzione: su un repository pubblico GitHub disattiva le schedule dopo
  # 60 giorni senza attivita' sul repo. Se il progetto si ferma, questa
  # smette di partire in silenzio: riattivala da Actions.
  schedule:
    - cron: '0 2 * * 2'   # martedì 04:00 Europe/Rome
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  manutenzione:
    # Immagine fissata: dal 19/10 al 19/11/2026 ubuntu-latest passa a
    # Ubuntu 26.04 (actions/runner-images#14748). Il passaggio a 26.04 si
    # prova in una PR sua, non arriva da solo.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Agisci come il subagent @maintenance (${CLAUDE_PLUGIN_ROOT}/agents/maintenance.md).

            1. Aggiornamenti patch e minor delle dipendenze, raggruppati per ecosistema.
            2. Test flaky: identifica, riproduci ripetendo, correggi la causa.
            3. Audit di sicurezza delle dipendenze: se emerge una CVE alta o critica,
               apri una issue con label `security` invece di una PR.

            UNA PR PER COSA. Mai mescolare. Non toccare file coinvolti in PR aperte.
            Ogni PR deve avere test verdi prima di essere aperta; se non passano, non
            aprirla e apri invece una issue con l'errore.

            Se in totale non c'è nulla da fare, non aprire nulla e termina.
          claude_args: |
            --max-turns 30
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash,Task"
            --model claude-haiku-4-6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
