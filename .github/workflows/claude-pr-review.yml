# Stadio 04 — ventaglio di verifica su ogni PR.
# Verifica la versione corrente dell'action prima di usarla in produzione:
# https://code.claude.com/docs/en/github-actions
name: Verifica agentica su PR

on:
  # Niente 'synchronize': il collaudo NON riparte a ogni push.
  # E' la leva piu' grossa sul consumo (circa meta'), e in aula e' anche piu'
  # leggibile: una PR, un collaudo. Per rifarlo a mano, commenta @claude
  # sulla PR oppure lancia /collaudo dalla sessione.
  pull_request:
    types: [opened, ready_for_review, reopened]

# Ogni job dichiara i suoi permessi. Nessuno qui, perche' un permesso a livello
# di workflow arriverebbe anche all'agente.
permissions: {}

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Fonte unica del budget: la legge il timeout-minutes dello step ventaglio
  # e la legge .github/scripts/collaudo-esito.sh per riconoscere il timeout.
  BUDGET_VENTAGLIO_MIN: 30

# Due job, perche' l'agente puo' scrivere $GITHUB_ENV e $GITHUB_PATH, e il
# runner li applica agli step successivi dello stesso job (#69). Nel job
# dell'agente, dopo l'agente, non si decide niente: si carica il file del
# verdetto. Giudica e pubblica un altro job, su un runner nuovo, che del job
# dell'agente riceve solo quel file, come dato, e due output valutati dal runner.
jobs:
  ventaglio:
    # Una PR da fork non si collauda: al runner non arrivano segreti, quindi
    # l'agente non parte, e il token e' di sola lettura, quindi nessun job potrebbe
    # commentare (docs: forked-secrets, pull_request_forked_repos_link). Saltati
    # entrambi i job, per costruzione; non verificato dal vivo.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Rete di sicurezza: il budget che conta e' quello dello step ventaglio, e
    # scade prima di questo. Il job non accetta env qui (contexts.md), quindi il
    # numero e' scritto a mano; tests/ci/test_collaudo_esito.py lo tiene sopra
    # il budget.
    timeout-minutes: 35
    # Sola lettura: l'action con github_token non chiede l'OIDC (token.ts), e
    # l'agente legge la PR con gh pr view e gh pr diff. Misura nel journal
    # 2026-09-29/080841.
    permissions:
      contents: read
      pull-requests: read
    # Solo espressioni che il runner valuta da se': l'esito dello step agente e
    # il tentativo del run. Mai un output di uno step successivo all'agente:
    # girerebbe con l'ambiente che l'agente puo' aver cambiato.
    outputs:
      esito: ${{ steps.ventaglio.outcome }}
      # Il tentativo in cui questo job ha girato: da' il nome all'artifact e
      # l'attempt da cui pubblica legge i tempi. Un rerun del solo job pubblica
      # ha un run_attempt suo, piu' alto.
      tentativo: ${{ github.run_attempt }}
    steps:
      # L'action rimette comunque il token nell'URL di origin (git-config.ts):
      # questo toglie solo quello del checkout. Il confine sono i permessi sopra.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Un .collaudo/verdetto.md arrivato col checkout passerebbe per il verdetto
      # di un agente rimasto muto: la cartella si svuota prima del ventaglio.
      # giro.txt fa esistere l'artifact anche quando l'agente tace: cosi' per
      # pubblica un artifact mancante e' un guasto, non un agente muto.
      - name: Prepara la cartella del verdetto
        run: |
          rm -rf "$GITHUB_WORKSPACE/.collaudo" && mkdir -p "$GITHUB_WORKSPACE/.collaudo"
          echo "tentativo ${GITHUB_RUN_ATTEMPT}" > "$GITHUB_WORKSPACE/.collaudo/giro.txt"

      # Lo SHA del commit sotto collaudo e' la chiave del verdetto. github.sha qui
      # e' il merge commit, non l'head della PR. Si stampa a ogni tentativo per
      # misurare che un rerun riusi lo stesso payload.
      - name: Commit sotto collaudo
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "tentativo ${GITHUB_RUN_ATTEMPT}"
          echo "github.event.pull_request.head.sha=${HEAD_SHA}"
          echo "github.sha=${MERGE_SHA}"

      - name: Ventaglio di revisione
        id: ventaglio
        timeout-minutes: ${{ fromJSON(env.BUDGET_VENTAGLIO_MIN) }}
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Senza questo input l'azione si autentica come app GitHub di Claude, che
          # su questo repo non e' installata: il 25/09 il collaudo e' fallito cosi',
          # 401 su tre tentativi. Passando il token del workflow i permessi restano
          # quelli dichiarati sul job invece dell'insieme completo che l'app pretende
          # (Actions, Workflows e hook in scrittura compresi).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Esegui la procedura di ${CLAUDE_PLUGIN_ROOT}/skills/collaudo/SKILL.md sulla PR
            #${{ github.event.pull_request.number }}.

            Il diff è `git diff origin/${{ github.base_ref }}...HEAD`.

            Lancia in parallelo i subagent pertinenti al diff: code-reviewer, qa-test,
            security, privacy, performance, accessibility. Salta quelli non pertinenti e
            dichiara quali hai saltato.

            Conferma ogni finding di gravità alta o critica con un subagent distinto che
            provi a confutarlo. Scarta quelli che non reggono.

            Non pubblicare niente sulla PR: il verdetto lo pubblica il workflow dopo di
            te. Scrivi il riepilogo con lo strumento Write, in un solo file, a questo
            percorso assoluto:

            ${{ github.workspace }}/.collaudo/verdetto.md

            Il riepilogo è ordinato per gravità, con file e riga, e i bloccanti in cima.
            Se non ci sono finding, scrivi comunque il file, con una riga che lo dice. Il
            file si scrive a ogni esecuzione, anche se sulla PR c'è già il verdetto di un
            collaudo precedente e anche se le conclusioni non cambiano: in quel caso scrivi
            che confermano il collaudo precedente. La prima riga del file è esattamente:

            ## Collaudo — run ${{ github.run_id }}, tentativo ${{ github.run_attempt }}

            A parte quel file, non modificare file. Non approvare. Non mergiare.
          # Il verdetto si scrive in .collaudo/: la regola di percorso sta su Edit,
          # perche' una regola Write(...) Claude Code l'accetta e non la consulta
          # mai (docs, permissions). In --permission-mode auto questa allow non
          # blocca una scrittura altrove, la manda al classificatore: il rimedio
          # contro $GITHUB_ENV e $GITHUB_PATH e' il job separato, non questa riga.
          # Di gh pr restano solo le letture; i gh che scrivono sono anche vietati
          # per nome, perche' in auto un comando non elencato puo' essere approvato
          # lo stesso, e un commento dell'agente si aggiungerebbe a quello del job.
          claude_args: |
            --max-turns 40
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Edit(./.collaudo/**),Bash(git *),Bash(gh pr view *),Bash(gh pr diff *),Task"
            --disallowedTools "Bash(gh pr comment *),Bash(gh pr review *),Bash(gh api *)"
            --model claude-opus-4-6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dopo l'agente, in questo job, solo la consegna del file: ogni step qui
      # gira nell'ambiente che l'agente puo' aver cambiato, e cio' che stampa puo'
      # diventare un comando di workflow (un nome di file con un a capo e
      # «::add-mask::…»). La diagnostica sul verdetto si fa in pubblica.

      # Il file del verdetto, se c'e', e giro.txt passano al job pubblica.
      # Nome col tentativo: un nome gia' presente nel run fa fallire l'upload
      # (overwrite false), e overwrite cancellerebbe quello del tentativo prima.
      - name: Consegna il verdetto
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdetto-tentativo-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.collaudo/verdetto.md
            ${{ github.workspace }}/.collaudo/giro.txt
          if-no-files-found: error
          # Il verdetto e' pubblico comunque, nel commento sulla PR; sette giorni
          # coprono un rerun del solo job pubblica. Oltre serve «Re-run all jobs»,
          # e il messaggio di pubblica per l'artifact mancante cita lo stesso 7.
          retention-days: 7

  # Giudica e pubblica. Runner nuovo: non eredita niente dall'ambiente del job
  # ventaglio. Gira quando il ventaglio finisce in qualunque stato, tranne una
  # run cancellata (a mano o dalla concurrency): expressions.md raccomanda
  # !cancelled() per «regardless of its success or failure»; always() girerebbe
  # anche su un annullamento. Cosa vede cancelled() quando e' il job ventaglio a
  # scadere la documentazione non lo dice (journal 2026-09-29/080841, punto 6).
  pubblica:
    needs: ventaglio
    # Stessa condizione del job ventaglio: con ventaglio saltato, !cancelled()
    # da solo farebbe girare questo job.
    if: ${{ !cancelled() && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # L'unico job che scrive sulla PR. actions: read serve all'API dei job e
    # degli artifact della run.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # Solo lo script della decisione, dal commit sotto collaudo come prima.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Fuori dal workspace, in una cartella che non contiene altro. Il file si
      # legge soltanto: mai eseguito, mai source, mai dentro un'espressione.
      # Quale esecuzione del ventaglio si giudica: il suo tentativo, dall'output
      # del job. Da qui vengono sia il nome dell'artifact sia l'attempt da cui si
      # leggono i tempi. L'artifact e' del run, non del tentativo (API degli
      # artifact: solo workflow_run.id). Nessuna riserva. L'unico caso documentato
      # di output mancante e' un valore mascherato: il runner salta un output che
      # «may contain secret», e qualcosa deve aver registrato quel valore con
      # «::add-mask::». E' un caso ostile, e si chiude con un messaggio suo:
      # «decisione non presa (output «tentativo» del job ventaglio mancante o non
      # valido)». Senza un tentativo valido il download non si tenta: un name
      # vuoto scaricherebbe tutti gli artifact del run.
      - name: Scegli il verdetto
        id: scegli
        env:
          TENTATIVO: ${{ needs.ventaglio.outputs.tentativo }}
        run: |
          if [[ "$TENTATIVO" =~ ^[1-9][0-9]*$ ]]; then
            echo "tentativo del ventaglio: ${TENTATIVO}; tentativo di questo job: ${GITHUB_RUN_ATTEMPT}"
            echo "tentativo=${TENTATIVO}" >> "$GITHUB_OUTPUT"
            echo "nome=verdetto-tentativo-${TENTATIVO}" >> "$GITHUB_OUTPUT"
          else
            echo "l'output tentativo del job ventaglio manca o non e' un numero: nessun artifact da cercare"
          fi

      - name: Ricevi il verdetto
        id: scarica
        if: ${{ steps.scegli.outputs.nome != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ steps.scegli.outputs.nome }}
          path: ${{ runner.temp }}/verdetto-ricevuto

      # Il testo dell'agente si copia neutralizzando ogni «cantiere-collaudo»:
      # il trattino diventa U+2011, che si legge uguale e non coincide col
      # marcatore. Il marcatore vero lo antepone lo script. Un artifact che non
      # si trova o non si scarica non e' mai «nessun verdetto»: e' «artifact non
      # trovato», e la decisione non si prende.
      - name: Prepara il verdetto
        id: prepara
        if: ${{ !cancelled() }}
        env:
          SCARICATO: ${{ steps.scarica.outcome }}
          RICEVUTO: ${{ runner.temp }}/verdetto-ricevuto/verdetto.md
          ARTEFATTO: ${{ steps.scegli.outputs.nome }}
        run: |
          trap 'echo "uscita=$?" >> "$GITHUB_OUTPUT"' EXIT
          verdetto="$RUNNER_TEMP/verdetto.md"
          rm -f "$verdetto"
          if [ -z "$ARTEFATTO" ]; then
            echo "artifact=senza-tentativo" >> "$GITHUB_OUTPUT"
            echo "::error title=Output tentativo non valido::l'output tentativo del job ventaglio manca o non e' un numero: download non tentato"
            exit 4
          fi
          if [ "$SCARICATO" != "success" ]; then
            echo "artifact=mancante" >> "$GITHUB_OUTPUT"
            echo "::error title=Artifact non trovato::'${ARTEFATTO:-nessun nome}', download: ${SCARICATO:-non eseguito}"
            exit 4
          fi
          echo "artifact ricevuto: ${ARTEFATTO}"
          # Diagnostica: cosa c'e' nell'artifact e il testo dell'agente, com'e'
          # arrivato. E' l'unico punto del job in cui dati dell'agente vanno nel
          # log, e stanno fra stop-commands e il suo token: una riga come
          # «::add-mask::…» o «::warning::…» resta testo. Il token e' nuovo a ogni
          # esecuzione, quindi il testo non lo puo' contenere per chiudere il blocco.
          blocco=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
          echo "::stop-commands::${blocco}"
          ls -la "$(dirname "$RICEVUTO")" || true
          if [ -f "$RICEVUTO" ]; then
            echo "--- verdetto.md come l'ha scritto l'agente:"
            cat "$RICEVUTO" || echo "(verdetto.md non leggibile)"
            echo
            echo "--- fine di verdetto.md"
          fi
          echo "::${blocco}::"
          if [ -f "$RICEVUTO" ]; then
            python3 - "$RICEVUTO" "$verdetto" <<'PY'
          import re, sys
          s = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          n = len(re.findall('cantiere-collaudo', s, flags=re.I))
          s = re.sub('cantiere-collaudo', lambda m: m.group(0).replace('-', '\u2011'), s, flags=re.I)
          open(sys.argv[2], 'w', encoding='utf-8').write(s)
          print(f'occorrenze di cantiere-collaudo neutralizzate: {n}')
          PY
          else
            echo "l'artifact ${ARTEFATTO} non contiene verdetto.md: l'agente non ha scritto il verdetto"
          fi
          # Un commento di GitHub non supera i 65536 caratteri. Qui si misura il file in
          # byte: in UTF-8 i byte sono almeno quanti i caratteri, quindi un tetto in byte
          # vale qualunque sia l'unita' che GitHub conta. Il perche' dei 60000 e' nel
          # commit che li introduce.
          byte=$(stat -c %s "$verdetto" 2>/dev/null || echo 0)
          if [ "$byte" -gt 60000 ]; then echo "lungo=true" >> "$GITHUB_OUTPUT"; else echo "lungo=false" >> "$GITHUB_OUTPUT"; fi
          echo "verdetto: $byte byte (tetto 60000)"

      - name: Conserva il verdetto intero
        id: artefatto
        if: ${{ !cancelled() && steps.prepara.outputs.lungo == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdetto-completo-tentativo-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verdetto.md
          if-no-files-found: error

      # Pubblicare non e' una scelta dell'agente: il 26/09 l'agente ha taciuto
      # su 4 riesecuzioni su 5, e sul rerun anche con l'istruzione di commentare
      # sempre (36257241401, tentativo 2). Il rosso e' riservato al verdetto
      # assente: un verdetto troppo lungo si pubblica troncato e resta verde.
      # Verdetto assente: la decisione la prende .github/scripts/collaudo-esito.sh.
      # Timeout -> rosso; stesso commit gia' collaudato -> rimando, verde; altrimenti
      # -> «nessun verdetto», rosso. Il marcatore nel primo rigo lo scrive lo script.
      # Ogni altra uscita -> «decisione non presa», senza marcatore, rosso.
      - name: Pubblica il verdetto
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ESITO_VENTAGLIO: ${{ needs.ventaglio.outputs.esito }}
          TENTATIVO: ${{ steps.scegli.outputs.tentativo }}
          PREPARA: ${{ steps.prepara.outcome }}
          USCITA_PREPARA: ${{ steps.prepara.outputs.uscita }}
          ARTIFACT: ${{ steps.prepara.outputs.artifact }}
          LUNGO: ${{ steps.prepara.outputs.lungo }}
          ARTEFATTO_URL: ${{ steps.artefatto.outputs.artifact-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          verdetto="$RUNNER_TEMP/verdetto.md"
          corpo="$RUNNER_TEMP/verdetto-da-pubblicare.md"
          # Nessun marcatore: una decisione non presa non e' un verdetto e non
          # deve diventare il bersaglio di un rimando.
          # $1 e' il motivo fra parentesi: «uscita N» o «artifact non trovato».
          non_presa() {
            printf 'Commit `%s`\n\n**Collaudo: decisione non presa (%s).** %s Il job non sa se questo commit abbia un verdetto.\n' \
              "${SHA:0:7}" "$1" "$2" > "$corpo"
            url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
            echo "::error title=Decisione non presa::${url}. ${2} (${1})"
            exit 1
          }
          if [ "$ARTIFACT" = "senza-tentativo" ]; then
            non_presa "output «tentativo» del job ventaglio mancante o non valido" "Senza quel valore il job non sa quale esecuzione del ventaglio giudicare, e il download non e' stato tentato."
          fi
          if [ "$ARTIFACT" = "mancante" ]; then
            # L'API non distingue un artifact scaduto da uno mai caricato: le liste
            # degli artifact non elencano quelli scaduti (journal 2026-10-01).
            non_presa "artifact non trovato: mai caricato o scaduto dopo 7 giorni; serve «Re-run all jobs»" "L'artifact del ventaglio non si e' trovato o non si e' scaricato."
          fi
          if [ "$PREPARA" != "success" ]; then
            non_presa "uscita ${USCITA_PREPARA:-sconosciuta}" "La preparazione del verdetto non e' riuscita."
          fi
          # I commenti servono solo al rimando: lo script li chiede con l'uscita 3,
          # dopo aver escluso verdetto e timeout. Un verdetto scritto si pubblica
          # senza nessuna chiamata all'API dei commenti (finding di /code-review 65).
          commenti="$RUNNER_TEMP/commenti.json"
          rm -f "$commenti"
          # Il tempo serve solo a riconoscere un timeout: verdetto assente ed esito
          # diverso da success. Negli altri casi l'API non si chiama. Si legge
          # dall'API dei job dell'attempt del ventaglio, non di questo job: nel
          # rerun del solo pubblica la copia del ventaglio nel nuovo attempt non
          # dava ancora i tempi (journal 2026-09-29/104703). Nessuna stima: senza
          # tempi la decisione non si prende.
          trascorsi=0; tempi_letti=no
          if [ ! -s "$verdetto" ] && [ "$ESITO_VENTAGLIO" != "success" ]; then
            tempi=""
            if [[ "$TENTATIVO" =~ ^[1-9][0-9]*$ ]]; then
              tempi=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$TENTATIVO/jobs" --paginate \
                --jq '.jobs[] | select(.name == "ventaglio") | .steps[] | select(.name == "Ventaglio di revisione") | "\(.started_at) \(.completed_at)"' \
                2>/dev/null | head -n 1) || tempi=""
            fi
            read -r t0 t1 <<< "$tempi" || true
            # date -d "" vale la mezzanotte di oggi: i campi vuoti si scartano prima.
            if [ -n "${t0:-}" ] && [ -n "${t1:-}" ] && s0=$(date -d "$t0" +%s 2>/dev/null) && s1=$(date -d "$t1" +%s 2>/dev/null) && [ "$s1" -ge "$s0" ]; then
              trascorsi=$((s1 - s0)); tempi_letti=si
              echo "ventaglio dall'API dei job, attempt ${TENTATIVO}: ${t0} -> ${t1}"
            else
              non_presa "tempi non leggibili" "L'API dei job (attempt '${TENTATIVO}') non ha dato inizio e fine dello step ventaglio ('${tempi}'), e senza verdetto il tempo serve a riconoscere un timeout."
            fi
          fi
          if [ "$tempi_letti" = "si" ]; then
            echo "ventaglio: ${ESITO_VENTAGLIO}, ${trascorsi} s su un budget di ${BUDGET_VENTAGLIO_MIN} min"
          else
            echo "ventaglio: ${ESITO_VENTAGLIO}; tempi non letti (non servono)"
          fi
          decidi() {
            bash "$GITHUB_WORKSPACE/.github/scripts/collaudo-esito.sh" \
              "$verdetto" "$SHA" "$commenti" "$ESITO_VENTAGLIO" "$trascorsi" "$BUDGET_VENTAGLIO_MIN" "$corpo"
          }
          rc=0; decisione=$(decidi) || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "lettura dei commenti della PR ${PR}"
            rc_gh=0; gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate > "$commenti" || rc_gh=$?
            # Una lettura fallita non e' «nessun verdetto»: non si sa se il commit
            # ne abbia gia' uno. Rosso, con un messaggio suo.
            if [ "$rc_gh" -ne 0 ]; then
              printf 'Commit `%s`\n\n**Collaudo: commenti non leggibili** (`gh api`, uscita %s). Questo giro non ha scritto un verdetto, e senza i commenti non si sa se il commit ne abbia già uno.\n' \
                "${SHA:0:7}" "$rc_gh" > "$corpo"
              url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
              echo "::error title=Commenti non leggibili::${url}. gh api sui commenti della PR ${PR} e' uscito con ${rc_gh}: il job non decide fra rimando e nessun verdetto."
              exit 1
            fi
            rc=0; decisione=$(decidi) || rc=$?
          fi
          if [ "$rc" -ne 0 ]; then
            non_presa "uscita $rc" "collaudo-esito.sh ha risposto '${decisione}'."
          fi
          echo "decisione: ${decisione}"
          case "$decisione" in
            verdetto) ;;
            rimando)
              url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
              echo "::notice title=Rimando al verdetto dello stesso commit::${url}. Questo giro non ha scritto un verdetto; il commit ${SHA} ne ha gia' uno."
              exit 0 ;;
            timeout)
              url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
              echo "::error title=Timeout del ventaglio::${url}. Il ventaglio e' finito con esito ${ESITO_VENTAGLIO} dopo ${trascorsi} s, budget ${BUDGET_VENTAGLIO_MIN} min. Inferito dal tempo: il contesto degli step non distingue una scadenza da un fallimento."
              exit 1 ;;
            nessun-verdetto)
              url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
              echo "::error title=Nessun verdetto::${url}. Il collaudo non ha lasciato un verdetto e il commit ${SHA} non ne ha uno precedente (ventaglio: ${ESITO_VENTAGLIO}). Non vuol dire che il collaudo abbia trovato problemi: non si sa se abbia revisionato."
              exit 1 ;;
            *)
              non_presa "uscita $rc" "collaudo-esito.sh ha risposto con una parola sconosciuta: '${decisione}'." ;;
          esac
          if [ "$ESITO_VENTAGLIO" != "success" ]; then
            printf '> **Nota del workflow:** il ventaglio di revisione è terminato con esito `%s`. Il verdetto qui sotto potrebbe essere incompleto.\n\n' "$ESITO_VENTAGLIO" >> "$corpo"
          fi
          if [ "$LUNGO" = "true" ]; then
            parte="$RUNNER_TEMP/verdetto-troncato.md"
            # 60000 byte, senza il carattere UTF-8 eventualmente spezzato. Se l'ultimo
            # a capo e' negli ultimi 4096 byte si taglia li', perche' una riga di tabella
            # spezzata non si legge; se e' piu' indietro si tiene il taglio grezzo, perche'
            # tornare all'a capo butterebbe una riga lunga intera.
            python3 - "$verdetto" "$parte" <<'PY'
          import sys
          s = open(sys.argv[1], 'rb').read()[:60000].decode('utf-8', 'ignore')
          a_capo = s.rfind('\n')
          if a_capo != -1 and len(s[a_capo + 1:].encode()) <= 4096:
              s = s[:a_capo + 1]
          open(sys.argv[2], 'w', encoding='utf-8').write(s)
          PY
            tot_b=$(stat -c %s "$verdetto"); pub_b=$(stat -c %s "$parte")
            tot_r=$(wc -l < "$verdetto"); pub_r=$(wc -l < "$parte")
            printf '> **Nota del workflow:** verdetto troncato. Pubblicati %s byte su %s, %s righe su %s: mancano %s byte e %s righe. Il file intero è fra gli artefatti della run: %s\n\n' \
              "$pub_b" "$tot_b" "$pub_r" "$tot_r" "$((tot_b - pub_b))" "$((tot_r - pub_r))" "${ARTEFATTO_URL:-artefatto non caricato}" >> "$corpo"
            cat "$parte" >> "$corpo"
            echo "::warning title=Verdetto troncato::pubblicati ${pub_b} byte su ${tot_b}; il file intero e' nell'artefatto verdetto-completo-tentativo-${GITHUB_RUN_ATTEMPT}"
          else
            cat "$verdetto" >> "$corpo"
          fi
          url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
          echo "::notice title=Verdetto pubblicato::${url}. Il job ha pubblicato il verdetto, non l'ha letto: se il collaudo ha trovato problemi lo dice il commento, non l'esito del job."
