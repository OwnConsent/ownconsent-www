# Stadio 04 — ventaglio di verifica su ogni PR.
# Verifica la versione corrente dell'action prima di usarla in produzione:
# https://code.claude.com/docs/en/github-actions
name: Verifica agentica su PR

on:
  # Niente 'synchronize': il collaudo NON riparte a ogni push.
  # E' la leva piu' grossa sul consumo (circa meta'), e in aula e' anche piu'
  # leggibile: una PR, un collaudo. Per rifarlo a mano, commenta @claude
  # sulla PR oppure lancia /collaudo dalla sessione.
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifica:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Serve al passo «Verdetto pubblicato». Non si usa il created_at della run:
      # a un rerun resta quello del primo tentativo, e il commento lasciato da un
      # tentativo precedente passerebbe per il verdetto di questo. Il run_started_at
      # del tentativo chiederebbe actions: read in piu'; l'orologio del runner no.
      - name: Inizio del collaudo
        run: echo "COLLAUDO_INIZIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Ventaglio di revisione
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Senza questo input l'azione si autentica come app GitHub di Claude, che
          # su questo repo non e' installata: il 25/09 il collaudo e' fallito cosi',
          # 401 su tre tentativi. Passando il token del workflow i permessi restano
          # quelli dichiarati sopra — contents: read, pull-requests: write — invece
          # dell'insieme completo che l'app pretende (Actions, Workflows e hook in
          # scrittura compresi).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Esegui la procedura di ${CLAUDE_PLUGIN_ROOT}/skills/collaudo/SKILL.md sulla PR
            #${{ github.event.pull_request.number }}.

            Il diff è `git diff origin/${{ github.base_ref }}...HEAD`.

            Lancia in parallelo i subagent pertinenti al diff: code-reviewer, qa-test,
            security, privacy, performance, accessibility. Salta quelli non pertinenti e
            dichiara quali hai saltato.

            Conferma ogni finding di gravità alta o critica con un subagent distinto che
            provi a confutarlo. Scarta quelli che non reggono.

            Pubblica UN SOLO commento di riepilogo con `gh pr comment`, ordinato per
            gravità, con file e riga. I bloccanti in cima. Se non ci sono finding, scrivi
            una riga che lo dice.

            Il commento è SEMPRE nuovo, uno per ogni esecuzione. Pubblicalo anche se
            sulla PR c'è già un commento di un collaudo precedente, e anche se le
            conclusioni non cambiano: in quel caso scrivi che confermano il collaudo
            precedente. Non modificare e non sostituire commenti esistenti. La prima
            riga del commento è esattamente:

            ## Collaudo — run ${{ github.run_id }}, tentativo ${{ github.run_attempt }}

            Non modificare file. Non approvare. Non mergiare.
          claude_args: |
            --max-turns 40
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Bash(git *),Bash(gh pr *),Task"
            --model claude-opus-4-6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Il ventaglio puo' uscire verde senza aver pubblicato niente: il 26/09 sulla
      # PR #60, run 36245446819, due tentativi. Il prompt chiede una riga anche
      # senza finding e non ha tenuto: qui lo si misura. Il passo guarda solo se un
      # verdetto esiste, non che cosa dice. Gira anche se il ventaglio e' fallito,
      # perche' anche un ventaglio rosso puo' aver commentato prima di fallire; non
      # gira su una run cancellata dalla concurrency.
      - name: Verdetto pubblicato
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          : "${COLLAUDO_INIZIO:?manca COLLAUDO_INIZIO: il passo «Inizio del collaudo» non ha girato}"
          if ! nuovi=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                --jq ".[] | select(.created_at > \"${COLLAUDO_INIZIO}\") | .html_url"); then
            echo "::error title=Commenti non letti::non riesco a leggere i commenti della PR #${PR}: non so se il collaudo abbia lasciato un verdetto."
            exit 1
          fi
          if [ -z "$nuovi" ]; then
            echo "::error title=Nessun verdetto::il collaudo non ha lasciato un verdetto: nessun commento sulla PR #${PR} creato dopo ${COLLAUDO_INIZIO}. Non vuol dire che il collaudo abbia trovato problemi: non si sa se abbia revisionato."
            exit 1
          fi
          echo "::notice title=Verdetto presente::commenti creati dopo ${COLLAUDO_INIZIO}: ${nuovi//$'\n'/ }. Questo passo non ne legge il contenuto: se il collaudo ha trovato problemi lo dice il commento, non l'esito del job."
