# Stadio 04 — ventaglio di verifica su ogni PR.
# Verifica la versione corrente dell'action prima di usarla in produzione:
# https://code.claude.com/docs/en/github-actions
name: Verifica agentica su PR

on:
  # Niente 'synchronize': il collaudo NON riparte a ogni push.
  # E' la leva piu' grossa sul consumo (circa meta'), e in aula e' anche piu'
  # leggibile: una PR, un collaudo. Per rifarlo a mano, commenta @claude
  # sulla PR oppure lancia /collaudo dalla sessione.
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verifica:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Il verdetto lo pubblica il job, non l'agente: l'agente scrive un file e il
      # passo «Pubblica il verdetto» lo commenta. Qui la cartella si svuota, perche'
      # un .collaudo/verdetto.md arrivato col checkout passerebbe per il verdetto
      # di un agente rimasto muto.
      - name: Prepara la cartella del verdetto
        run: rm -rf "$GITHUB_WORKSPACE/.collaudo" && mkdir -p "$GITHUB_WORKSPACE/.collaudo"

      - name: Ventaglio di revisione
        id: ventaglio
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Senza questo input l'azione si autentica come app GitHub di Claude, che
          # su questo repo non e' installata: il 25/09 il collaudo e' fallito cosi',
          # 401 su tre tentativi. Passando il token del workflow i permessi restano
          # quelli dichiarati sopra — contents: read, pull-requests: write — invece
          # dell'insieme completo che l'app pretende (Actions, Workflows e hook in
          # scrittura compresi).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Esegui la procedura di ${CLAUDE_PLUGIN_ROOT}/skills/collaudo/SKILL.md sulla PR
            #${{ github.event.pull_request.number }}.

            Il diff è `git diff origin/${{ github.base_ref }}...HEAD`.

            Lancia in parallelo i subagent pertinenti al diff: code-reviewer, qa-test,
            security, privacy, performance, accessibility. Salta quelli non pertinenti e
            dichiara quali hai saltato.

            Conferma ogni finding di gravità alta o critica con un subagent distinto che
            provi a confutarlo. Scarta quelli che non reggono.

            Non pubblicare niente sulla PR: il verdetto lo pubblica il workflow dopo di
            te. Scrivi il riepilogo con lo strumento Write, in un solo file, a questo
            percorso assoluto:

            ${{ github.workspace }}/.collaudo/verdetto.md

            Il riepilogo è ordinato per gravità, con file e riga, e i bloccanti in cima.
            Se non ci sono finding, scrivi comunque il file, con una riga che lo dice. Il
            file si scrive a ogni esecuzione, anche se sulla PR c'è già il verdetto di un
            collaudo precedente e anche se le conclusioni non cambiano: in quel caso scrivi
            che confermano il collaudo precedente. La prima riga del file è esattamente:

            ## Collaudo — run ${{ github.run_id }}, tentativo ${{ github.run_attempt }}

            A parte quel file, non modificare file. Non approvare. Non mergiare.
          # Write serve al file del verdetto. Di gh pr restano solo le letture; i gh
          # che scrivono sono anche vietati per nome, perche' in --permission-mode auto
          # un comando non elencato puo' essere approvato lo stesso, e un commento
          # dell'agente si aggiungerebbe a quello del job.
          claude_args: |
            --max-turns 40
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Write,Bash(git *),Bash(gh pr view *),Bash(gh pr diff *),Task"
            --disallowedTools "Bash(gh pr comment *),Bash(gh pr review *),Bash(gh api *)"
            --model claude-opus-4-6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Misure, non logica: dove sta il file, se ce n'e' uno altrove (percorso
      # relativo), e se l'agente ha sbattuto contro un permesso.
      - name: Diagnostica del ventaglio
        if: ${{ !cancelled() }}
        env:
          ESECUZIONE: ${{ steps.ventaglio.outputs.execution_file }}
        run: |
          ls -la "$GITHUB_WORKSPACE/.collaudo/" || true
          echo "file verdetto*.md trovati:"
          find "$GITHUB_WORKSPACE" /tmp "$HOME" -name 'verdetto*.md' -printf '%p %s byte %TT\n' 2>/dev/null | sort -u || true
          if [ -n "$ESECUZIONE" ] && [ -f "$ESECUZIONE" ]; then
            jq -c '[.[] | select(.type == "result")] | last | {num_turns, permission_denials_count: (.permission_denials | length), permission_denials}' "$ESECUZIONE" || true
          else
            echo "execution_file non disponibile: '${ESECUZIONE}'"
          fi

      # Pubblicare non e' piu' una scelta dell'agente: il 26/09 l'agente ha taciuto
      # su 4 riesecuzioni su 5, e sul rerun anche con l'istruzione di commentare
      # sempre (36257241401, tentativo 2). Gira anche
      # se il ventaglio e' fallito (il perche' e' nel commit che lo introduce); non
      # gira su una run cancellata dalla concurrency.
      - name: Pubblica il verdetto
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ESITO_VENTAGLIO: ${{ steps.ventaglio.outcome }}
        run: |
          verdetto="$GITHUB_WORKSPACE/.collaudo/verdetto.md"
          if [ ! -s "$verdetto" ]; then
            echo "::error title=Nessun verdetto::il collaudo non ha lasciato un verdetto: ${verdetto} manca o e' vuoto (ventaglio: ${ESITO_VENTAGLIO}). Non vuol dire che il collaudo abbia trovato problemi: non si sa se abbia revisionato."
            exit 1
          fi
          corpo="$RUNNER_TEMP/verdetto-da-pubblicare.md"
          if [ "$ESITO_VENTAGLIO" != "success" ]; then
            printf '> **Nota del workflow:** il ventaglio di revisione è terminato con esito `%s`. Il verdetto qui sotto potrebbe essere incompleto.\n\n' "$ESITO_VENTAGLIO" > "$corpo"
          else
            : > "$corpo"
          fi
          cat "$verdetto" >> "$corpo"
          url=$(gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$corpo")
          echo "::notice title=Verdetto pubblicato::${url}. Il job ha pubblicato il verdetto, non l'ha letto: se il collaudo ha trovato problemi lo dice il commento, non l'esito del job."
