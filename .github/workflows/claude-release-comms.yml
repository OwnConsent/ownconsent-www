# Stadio 07 — note di rilascio dai commit e dalle specifiche.
name: Note di rilascio agentiche

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag da documentare
        required: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  note:
    # Immagine fissata a ubuntu-26.04: migrazione fatta con una prova
    # (PR #84, journal/2026-10-04/163102), non per il calendario di
    # ubuntu-latest (actions/runner-images#14748).
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Senza questo input l'azione si autentica come app GitHub di Claude, che
          # su questo repo non e' installata (401 sul notturno, run 36537879381).
          # Col token del workflow i permessi sono quelli dichiarati sopra, e
          # l'OIDC non viene chiesto (token.ts).
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Prepara le note di rilascio per il tag
            ${{ github.event.inputs.tag || github.ref_name }}.

            Delega a @comms-release la scrittura e a @docs-writer il changelog tecnico.
            I numeri devono venire da una fonte: se non ci sono, ometti la voce.

            Scrivi il risultato in RELEASE_NOTES_DRAFT.md e apri una PR con quel file.
            NON creare la release su GitHub e non pubblicare nulla altrove: è un gate umano.
          claude_args: |
            --permission-mode auto
            --allowedTools "Read,Grep,Glob,Write,Bash(git *),Bash(gh issue view *),Bash(gh pr *),Task"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
